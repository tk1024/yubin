name: Release and update postal data

on:
  push:
    tags:
      - "v*"
  schedule:
    # 毎日 9:23 JST。npm Trusted Publisher と同じファイルで公開する。
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC Trusted Publisher support
        run: npm install -g npm@11.12.1

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recover the last published GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx scripts/github-release.ts

      - name: Download and validate postal data
        run: pnpm download:data

      - name: Build data
        run: pnpm build:data

      - name: Compare with the published package and select version
        id: plan
        run: pnpm exec tsx scripts/prepare-release.ts

      - name: Validate data and package
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build

      - name: Record data version and monthly activity
        if: github.event_name != 'push'
        run: |
          # A monthly commit also prevents the 60-day schedule inactivity cutoff.
          node -e 'require("node:fs").writeFileSync(".github/postal-data-check.json", JSON.stringify({ checkedMonth: new Date().toISOString().slice(0, 7) }, null, 2) + "\n")'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json postal-data.json .github/postal-data-check.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 郵便番号データと取得記録を更新'
            # Never force-push over concurrent changes; retry on the next run.
            git push origin HEAD:main
          fi

      - name: Publish to npm
        id: publish
        if: steps.plan.outputs.publish == 'true'
        run: |
          npm config delete '//registry.npmjs.org/:_authToken' 2>/dev/null || true
          npm publish --provenance --access public

      - name: Wait for the accepted npm version to become available
        id: availability
        if: steps.publish.outcome == 'success' && steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: pnpm exec tsx scripts/wait-for-publication.ts

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: pnpm exec tsx scripts/github-release.ts

      - name: Summarize update
        if: always()
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          AVAILABILITY_OUTCOME: ${{ steps.availability.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        run: |
          {
            echo "npm version: $VERSION"
            echo "Publish request: $PUBLISH_OUTCOME"
            echo "Availability check: $AVAILABILITY_OUTCOME"
            echo "GitHub Release: $RELEASE_OUTCOME"
            if [ "$PUBLISH_OUTCOME" = 'success' ] && [ "$AVAILABILITY_OUTCOME" != 'success' ]; then
              echo 'Upload accepted; availability unconfirmed. Do not republish while npm is processing. Check availability before rerunning.'
            fi
            if [ -f postal-data.json ]; then
              cat postal-data.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
